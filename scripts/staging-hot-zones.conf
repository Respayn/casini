# Реестр «горячих зон» staging: path|grep-pattern|reason
# Если pattern есть на remote, но отсутствует в локальном файле при деплое — FAIL.
# Специальный маркер __HOT_SHRINK__: локальный файл заметно короче remote → FAIL.
#
# ПРАВИЛО ДЕПЛОЯ: файлы из этого реестра не выкладывать с feature-ветки напрямую.
# Сначала merge/cherry-pick актуального staging (или скачать версию с сервера),
# наложить свои правки, прогнать staging-pre-deploy-check.sh, затем staging-deploy-files.sh.
# Дополнять при новых инцидентах / merge feature-веток на staging.
#
# Инцидент 2026-08-06: деплой feature/sidebar-widget затёр
# channels-direct-metrics + statistics-integration-data + биндинг IntegrationSyncDispatcher.

